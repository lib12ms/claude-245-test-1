services:
  - type: web
    name: kormarc-api
    runtime: python
    buildCommand: pip install -r requirements.txt
    # 합저는 저자 프로필 HTTP가 많음 — 타임아웃 짧으면 Render/HTML 502·504가 납니다.
    startCommand: gunicorn --bind 0.0.0.0:$PORT --workers 1 --threads 4 --timeout 300 --graceful-timeout 90 app:app
    envVars:
      - key: ALADIN_API_KEY
        sync: false
